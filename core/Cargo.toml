[package]
name = "bridgething"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
default-run = "bridgething"

[dependencies]
libbridgething = { path = "../lib" }

# workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "fast-rng"] }
serde_with = { workspace = true, features = ["json"] }
derive_more = { workspace = true, features = ["debug"] }
bluer = { workspace = true, features = ["bluetoothd", "l2cap", "rfcomm"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
flate2 = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }

# systemd feature
sd-notify = { version = "0.4.5", optional = true }

# als feature

# mic feature

# chrome feature
headless_chrome = { version = "1.0.17", optional = true }

# serve feature
warp = { version = "0.3", optional = true }

# dependencies
tokio-tungstenite = "0.26.2"
axum = { version = "0.8.3", features = ["ws", "macros"] }
tower-http = { version = "0.6.2", features = ["fs"] }
dirs = "5.0.1"
bincode = "1.3.3"
zbus = { version = "5.5.0", default-features = false, features = ["tokio"] }
quick_cache = "0.6.10"
dashmap = { version = "6.1.0", features = ["serde"] }
base64 = "0.22.1"
ahash = "0.8.11"
reqwest = { version = "0.12.15", features = ["json"] }
mime_guess = "2.0.5"


[features]
default = ["chrome"]
als = []
mic = []
chrome = ["dep:headless_chrome"]
systemd = ["dep:sd-notify"]
superbird = ["als", "mic", "systemd", "chrome"]
# dev features
no-persist = []

[[example]]
name = "cover_art"
path = "./examples/cover_art.rs"
