pluginManagement {
  includeBuild("../node_modules/@react-native/gradle-plugin")
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
}
plugins {
  id("com.facebook.react.settings")
  id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'bridgething'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

def repoRoot = file('../..')
def setProj(path, dir) {
  include path
  project(path).projectDir = file(dir)
}

setProj(':packages', "${repoRoot}/packages")

setProj(':packages:companion', "${repoRoot}/packages/companion")
setProj(':packages:companion:kotlin', "${repoRoot}/packages/companion/kotlin")
setProj(':packages:companion:kotlin:companion', "${repoRoot}/packages/companion/kotlin/companion")
setProj(':packages:companion:kotlin:core', "${repoRoot}/packages/companion/kotlin/core")

setProj(':packages:asr', "${repoRoot}/packages/asr")
setProj(':packages:asr:kotlin', "${repoRoot}/packages/asr/kotlin")
setProj(':packages:asr:kotlin:whisper', "${repoRoot}/packages/asr/kotlin/whisper")
