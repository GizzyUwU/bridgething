buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-serialization:2.1.20")
    }
}

// nitro autolinks only the native side, not the kotlin classpath; substitute here so the
// version-less nitro coord resolves to the local project.
subprojects { sub ->
  sub.configurations.all { config ->
    config.resolutionStrategy.dependencySubstitution {
      substitute(module("com.margelo.nitro:react-native-nitro-modules"))
        .using(project(":react-native-nitro-modules"))
        .because("nitro autolinks only the native side, not the kotlin classpath")
    }
  }
  // bare container projects carry newArchEnabled only via gradle.properties inheritance;
  // pre-register as ext so the RN rootproject plugin's setProperty call doesn't throw.
  sub.extensions.extraProperties.set("newArchEnabled", "true")
  sub.extensions.extraProperties.set("react.newArchEnabled", "true")
}

// on a cold build session-rn's per-abi cmake configure can run before nitro-modules has
// packaged that abi's prefab, leaving the imported target empty and dropping libNitroModules.so;
// force the producer's prefab tasks to complete first.
gradle.projectsEvaluated {
  def nitro = findProject(":react-native-nitro-modules")
  def session = findProject(":bridgething_session-react-native")
  if (nitro != null && session != null) {
    def prefabTasks = nitro.tasks.matching { it.name.toLowerCase().contains("prefab") }
    session.tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }
      .configureEach { dependsOn prefabTasks }
  }
}

apply plugin: "com.facebook.react.rootproject"
