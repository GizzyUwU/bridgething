[package]
name = "libbridgething"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "fast-rng"] }
serde_with = { workspace = true, features = ["json"] }
derive_more = { workspace = true, features = ["debug"] }

ts-rs = { version = "10.1.0", features = ["uuid-impl", "no-serde-warnings"] }
