# bridgething root gradle settings.
#
# Mirror of mobile/android/gradle.properties for the bits that the
# companion + gateway library builds need; the host app's settings still
# live under mobile/android/.

org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
