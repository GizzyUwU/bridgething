name: desktop-check

on:
  pull_request:
    paths:
      - "desktop/**"
      - "crates/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-check.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "crates/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-check.yml"
  workflow_dispatch:
    inputs:
      bundle:
        description: also run a full tauri build (slow; proves the bundler, not just the compile)
        type: boolean
        default: false

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: linux bundling deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf clang
          { echo "CC=clang"; echo "CXX=clang++"; } >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: build the frontend and its workspace deps
        run: bunx turbo run build --filter='@bridgething/desktop-frontend...'

      - name: typecheck the frontend
        run: bunx turbo run typecheck --filter='@bridgething/desktop-frontend'

      - name: cargo check
        run: cargo check -p bridgething-desktop

      - name: cargo test
        run: cargo test -p bridgething-desktop

      - name: bundle
        if: ${{ inputs.bundle }}
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_KEY_PASSWORD }}
          BRIDGETHING_AUTH_PSK: ${{ secrets.BRIDGETHING_AUTH_PSK }}
        run: bun run tauri build
