syntax = "proto3";

package sp.collection;

message Item {
  string uri = 1;
  int64 added_at = 2;
  bool is_removed = 3;
  string source = 4;
}

message WriteRequest {
  string username = 1;
  string set = 2;
  repeated Item items = 3;
}

message DeltaRequest {
  string username = 1;
  string set = 2;
  string last_revision = 3;
}

message DeltaResponse {
  int32 sync_type = 1;
  repeated Item items = 2;
  string new_revision = 3;
}
