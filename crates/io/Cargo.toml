[package]
name = "bridgething-io"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
futures = { workspace = true, optional = true }
reqwest = { version = "0.13.4", features = [
  "json",
  "gzip",
  "stream",
  "form",
  "query",
], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-tungstenite = { workspace = true, features = [
  "rustls-tls-webpki-roots",
], optional = true }
tracing.workspace = true
uuid.workspace = true

[features]
default = []
native-io = [
  "dep:futures",
  "dep:reqwest",
  "dep:tokio-tungstenite",
  "tokio/rt",
  "tokio/macros",
  "tokio/time",
]
web-io = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.103", optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4.76", optional = true }
web-sys = { version = "0.3.103", optional = true, features = [
  "AbortController",
  "AbortSignal",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "Response",
] }

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "time",
] }
tokio-tungstenite = { workspace = true }
