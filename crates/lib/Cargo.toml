[package]
name = "libbridgething"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7", "serde", "fast-rng"] }
serde_with = { workspace = true, features = ["json"] }
derive_more = { workspace = true, features = ["debug", "from"] }
paste = "1.0.15"
bridgething-macros = { path = "../macros" }

# type generation
ts-rs = { version = "12.0.1", features = ["uuid-impl", "no-serde-warnings"] }

# codec/endec
tokio-util = { workspace = true, features = ["codec"], optional = true }
thiserror = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
rmpv = { version = "1.3.1", optional = true }
tracing = { workspace = true, optional = true }
bytes = { version = "1.11.1", features = ["serde"] }
web-time = { version = "1.1.0", optional = true }

[features]
default = ["protocol"]
protocol = [
  "dep:tokio-util",
  "dep:thiserror",
  "dep:flate2",
  "dep:rmp-serde",
  "dep:rmpv",
  "dep:tracing",
  "dep:web-time",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
futures.workspace = true
hex = "0.4.3"
sha2 = "0.11.0"
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
