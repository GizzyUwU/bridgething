[package]
name = "bridgething-iap2"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[features]
# device-half (iPhone-side) iAP2 emulator for T3 over-air testing. Off in prod;
# the daemon never enables it. Adds the responder link role + a scripted
# device-side session driver under src/emulator/.
emulator = []

[dependencies]
bridgething-macros = { path = "../macros" }
bridgething-mfi = { path = "../mfi" }
bytes = "1.10.1"
bitflags = "2.9.4"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "sync",
  "time",
  "io-util",
  "macros",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
async-trait.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
