[package]
name = "bridgething-iap2"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[features]
emulator = []

[dependencies]
bridgething-macros = { path = "../macros" }
bridgething-mfi = { path = "../mfi" }
bytes = "1.10.1"
bitflags = "2.9.4"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "sync",
  "time",
  "io-util",
  "macros",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
async-trait.workspace = true
uuid.workspace = true
bridgething-sdk-runtime = { path = "../sdk-runtime" }
libbridgething = { path = "../lib", default-features = false }

[dev-dependencies]
bridgething-sdk-runtime = { path = "../sdk-runtime", features = ["lane-corpus"] }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
