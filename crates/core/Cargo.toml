[package]
name = "bridgething"
default-run = "bridgething"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
libbridgething = { path = "../lib" }

# workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "fast-rng"] }
serde_with = { workspace = true, features = ["json"] }
derive_more = { workspace = true, features = ["debug", "from"] }
bluer = { workspace = true, features = ["bluetoothd", "l2cap", "rfcomm"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
flate2 = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }

# systemd feature
sd-notify = { version = "0.5.0", optional = true }

# als feature

# mic feature

# chrome feature
headless_chrome = { version = "1.0.21", optional = true }

# serve feature
warp = { version = "0.4", optional = true }

# dependencies
tokio-tungstenite = "0.29.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.6.8", features = ["fs"] }
dirs = "6.0.0"
bincode = "1.3.3"
dashmap = { version = "6.1.0", features = ["serde"] }
base64 = "0.22.1"
reqwest = { version = "0.13.3", features = ["json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tower = { version = "0.5.3", features = ["util"] }
bridgething-iap2 = { version = "0.1.0", path = "../iap2" }
bridgething-mfi = { version = "0.1.0", path = "../mfi" }
anyhow = "1.0.102"
sea-orm = { version = "1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-uuid"] }
bytes = "1.11.1"
lru = "0.18.0"


[features]
default = ["superbird"]
als = []
mic = []
chrome = ["dep:headless_chrome"]
systemd = ["dep:sd-notify"]
superbird = ["als", "mic", "systemd", "chrome"]
# dev features
no-persist = []

[[example]]
name = "cover_art"
path = "./examples/cover_art.rs"
