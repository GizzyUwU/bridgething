[workspace]
resolver = "3"
members = ["core", "dev/adapter", "client/rust"]

[workspace.dependencies]
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
uuid = { version = "1.11.0", features = ["v7", "serde", "fast-rng"] }
serde_with = { version = "3.11.0", features = ["json"] }
derive_more = { version = "1.0.0", features = ["debug"] }

[profile.release]
lto = true
strip = "symbols"
