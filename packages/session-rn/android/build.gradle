buildscript {
  ext.getExtOrDefault = { name, defaultValue ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
  }

  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.13.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

apply from: '../nitrogen/generated/android/BridgethingSession+autolinking.gradle'

android {
  namespace "com.bridgething.session"
  compileSdk getExtOrDefault("compileSdkVersion", 35).toInteger()
  ndkVersion getExtOrDefault("ndkVersion", "27.1.12297006").toString()

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 26).toInteger()
    targetSdkVersion getExtOrDefault("targetSdkVersion", 35).toInteger()

    ndk {
      abiFilters.addAll((findProperty("reactNativeArchitectures") ?: "arm64-v8a").toString().split(",").collect { it.trim() })
    }

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  buildFeatures {
    buildConfig false
    prefab true
    prefabPublishing true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      manifest.srcFile "src/main/AndroidManifest.xml"
      java.srcDirs += ["src/main/java"]
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    jniLibs {
      excludes = ["**/libreact_*.so", "**/libfbjni.so"]
    }
  }

  prefab {
    BridgethingSession {
      headers "${project.projectDir}/../nitrogen/generated/shared/c++"
    }
  }
}

kotlin {
  jvmToolchain(17)
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // RN gradle plugin substitutes both of these for the autolinked
  // project deps (`:react-native-nitro-modules` + `:react-android`).
  implementation "com.facebook.react:react-android"
  implementation "com.margelo.nitro:react-native-nitro-modules"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
