buildscript {
  ext.getExtOrDefault = { name, defaultValue ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
  }

  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.13.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

apply from: '../nitrogen/generated/android/BridgethingSession+autolinking.gradle'

android {
  namespace "com.bridgething.session"
  compileSdk getExtOrDefault("compileSdkVersion", 35).toInteger()

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 26).toInteger()
    targetSdkVersion getExtOrDefault("targetSdkVersion", 35).toInteger()
  }

  buildFeatures {
    buildConfig false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      manifest.srcFile "src/main/AndroidManifest.xml"
      java.srcDirs += ["src/main/java"]
    }
  }
}

kotlin {
  jvmToolchain(17)
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.margelo.nitro:react-native-nitro-modules"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
